{% extends "base.html" %}

{% block title %}New Scan — QUADSEER{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-white mb-6">🚀 Launch New Scan</h1>

    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg"
         x-data="{ 
             targetId: '{{ targets[0].id if targets else '' }}',
             scanType: 'breach',
             loading: false,
             message: '',
             error: ''
         }">

        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-300 mb-2">Target</label>
            <select x-model="targetId" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-cyan-500 focus:border-transparent">
                {% for t in targets %}
                <option value="{{ t.id }}">{{ t.target }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-300 mb-2">Scan Type</label>
            <select x-model="scanType" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-cyan-500 focus:border-transparent">
                <option value="breach">🔓 Breach Checker (HIBP + DeHashed)</option>
                <option value="ransomware">🎭 Ransomware Tracker (ransomware.live)</option>
                <option value="darkweb">🕸️ Dark Web Monitor (DeHashed)</option>
                <option value="reconnaissance">🔍 Reconnaissance (DNS, Ports, SSL, Tech)</option>
                <option value="subdomain">🌐 Subdomain Enumeration (crt.sh + DNS brute)</option>
                <option value="vulnerability">🛡️ Vulnerability Scan (Nuclei — coming soon)</option>
                <option value="certificate">📜 Certificate Transparency (crt.sh)</option>
                <option value="typosquatting">🎣 Typosquatting Detection (coming soon)</option>
            </select>
            <p class="text-xs text-slate-400 mt-1" x-show="scanType === 'subdomain'">
                ✅ No API key required. Uses crt.sh (SSL cert logs) + DNS brute force.
            </p>
            <p class="text-xs text-slate-400 mt-1" x-show="scanType === 'darkweb'">
                💡 Configure DeHashed credentials in Admin → API Keys for best results.
            </p>
        </div>

        <button 
            @click="
                loading = true; error = ''; message = '';
                fetch('/scans/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({target_id: parseInt(targetId), scan_type: scanType})
                })
                .then(r => r.json().then(data => ({status: r.status, body: data})))
                .then(({status, body}) => {
                    loading = false;
                    if (status >= 400) {
                        error = body.detail || 'Scan failed';
                    } else {
                        message = 'Scan launched! Redirecting...';
                        setTimeout(() => window.location.href = '/scans/' + body.id, 800);
                    }
                })
                .catch(e => { loading = false; error = e.message; })
            "
            :disabled="loading"
            class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold py-3 px-6 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed"
        >
            <span x-show="!loading">🚀 Launch Scan</span>
            <span x-show="loading" class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Running scan...
            </span>
        </button>

        <div x-show="message" x-text="message" class="mt-4 p-3 bg-green-900/50 border border-green-700 rounded-lg text-green-300 text-sm"></div>
        <div x-show="error" x-text="error" class="mt-4 p-3 bg-red-900/50 border border-red-700 rounded-lg text-red-300 text-sm"></div>
    </div>
</div>
{% endblock %}
