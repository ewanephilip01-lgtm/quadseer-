<div x-data x-show="$store.toasts.items.length > 0" class="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
    <template x-for="toast in $store.toasts.items" :key="toast.id">
        <div 
            x-show="toast.visible"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-x-full"
            x-transition:enter-end="opacity-100 translate-x-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-x-0"
            x-transition:leave-end="opacity-0 translate-x-full"
            :class="'toast toast-' + toast.type"
            @click="$store.toasts.remove(toast.id)"
        >
            <span x-text="toast.message"></span>
            <button class="toast-close" @click.stop="$store.toasts.remove(toast.id)">×</button>
        </div>
    </template>
</div>
