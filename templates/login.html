{% extends "base.html" %}
{% block title %}Login — QuadSeer{% endblock %}
{% block content %}
<div class="auth-container">
    <article class="auth-card">
        <header>
            <h1>Welcome Back</h1>
            <p>Sign in to your QuadSeer dashboard</p>
        </header>
        <form x-data="loginForm()" @submit.prevent="submit()">
            <label>
                Username
                <input type="text" x-model="form.username" required placeholder="Username">
            </label>
            <label>
                Password
                <input type="password" x-model="form.password" required placeholder="Password">
            </label>
            <button type="submit" class="btn btn-primary" :disabled="submitting" aria-busy="submitting">
                <span x-show="!submitting">Sign In</span>
                <span x-show="submitting">Signing in...</span>
            </button>
            <p class="auth-footer">Don't have an account? <a href="/register">Create one</a></p>
            <p class="hint">Default: admin / admin</p>
        </form>
    </article>
</div>
{% endblock %}

{% block scripts %}
<script>
function loginForm() {
    return {
        form: { username: '', password: '' },
        submitting: false,

        async submit() {
            this.submitting = true;
            try {
                const formData = new URLSearchParams();
                formData.append('username', this.form.username);
                formData.append('password', this.form.password);

                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    $store.toasts.add('Signed in successfully', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    $store.toasts.add('Invalid credentials', 'error');
                }
            } catch (e) {
                $store.toasts.add('Network error', 'error');
            } finally {
                this.submitting = false;
            }
        }
    }
}
</script>
{% endblock %}
