<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuadSeer{% endblock %}</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .spinner { border: 3px solid #e2e8f0; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen" x-data="app()">
    {% if request.path not in ['/login', '/register'] %}
    <nav class="bg-slate-800 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i class="fas fa-shield-halved text-blue-400 text-2xl"></i>
                    <span class="font-bold text-xl">QuadSeer</span>
                    <span class="text-xs bg-blue-600 px-2 py-0.5 rounded-full">v3.0</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/dashboard" class="hover:text-blue-400 transition"><i class="fas fa-chart-line mr-1"></i>Dashboard</a>
                    <a href="/targets" class="hover:text-blue-400 transition"><i class="fas fa-bullseye mr-1"></i>Targets</a>
                    <a href="/scans" class="hover:text-blue-400 transition"><i class="fas fa-radar mr-1"></i>Scans</a>
                    <a href="/admin" class="hover:text-blue-400 transition"><i class="fas fa-cog mr-1"></i>Admin</a>
                    <button @click="logout()" class="text-red-400 hover:text-red-300"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <!-- Toast container -->
    <div class="fixed top-4 right-4 z-50 space-y-2" x-show="toasts.length > 0" x-cloak>
        <template x-for="toast in toasts" :key="toast.id">
            <div class="toast px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 min-w-[300px]"
                 :class="toast.type === 'error' ? 'bg-red-900/90 border border-red-700' : toast.type === 'success' ? 'bg-green-900/90 border border-green-700' : 'bg-blue-900/90 border border-blue-700'">
                <i :class="toast.type === 'error' ? 'fas fa-circle-xmark text-red-400' : toast.type === 'success' ? 'fas fa-circle-check text-green-400' : 'fas fa-circle-info text-blue-400'"></i>
                <span x-text="toast.message" class="text-sm"></span>
                <button @click="removeToast(toast.id)" class="ml-auto text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
        </template>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        function app() {
            return {
                toasts: [],
                token: localStorage.getItem('token') || '',

                showToast(message, type = 'info') {
                    const id = Date.now();
                    this.toasts.push({ id, message, type });
                    setTimeout(() => this.removeToast(id), 5000);
                },

                removeToast(id) {
                    this.toasts = this.toasts.filter(t => t.id !== id);
                },

                async api(method, url, body = null) {
                    const opts = {
                        method,
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + this.token
                        }
                    };
                    if (body) opts.body = JSON.stringify(body);

                    try {
                        const resp = await fetch(url, opts);
                        const data = await resp.json();
                        if (!resp.ok) {
                            this.showToast(data.detail || 'Request failed', 'error');
                            throw new Error(data.detail);
                        }
                        return data;
                    } catch (e) {
                        this.showToast(e.message, 'error');
                        throw e;
                    }
                },

                logout() {
                    localStorage.removeItem('token');
                    window.location.href = '/login';
                }
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
