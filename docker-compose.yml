services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: quadseer
      POSTGRES_PASSWORD: quadseer_secret
      POSTGRES_DB: quadseer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quadseer"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://quadseer:quadseer_secret@db:5432/quadseer
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: quadseer-dev-secret-key-change-in-production
      DEBUG: "true"
      PYTHONPATH: /app
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  celery-worker:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://quadseer:quadseer_secret@db:5432/quadseer
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: quadseer-dev-secret-key-change-in-production
      DEBUG: "true"
      PYTHONPATH: /app
    volumes:
      - ./app:/app/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: celery -A app.tasks.scan_tasks.celery_app worker --loglevel=info --concurrency=2

  celery-beat:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://quadseer:quadseer_secret@db:5432/quadseer
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: quadseer-dev-secret-key-change-in-production
      DEBUG: "true"
      PYTHONPATH: /app
    volumes:
      - ./app:/app/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: celery -A app.tasks.scan_tasks.celery_app beat --loglevel=info

  seed:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://quadseer:quadseer_secret@db:5432/quadseer
      PYTHONPATH: /app
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      - db
    restart: "no"
    command: python scripts/seed_data.py

volumes:
  postgres_data:
